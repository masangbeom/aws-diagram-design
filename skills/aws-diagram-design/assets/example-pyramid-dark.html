<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS migration pyramid · effort vs. value</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #161e2d;
      --color-ink:     #ffffff;
      --color-muted:   #b6bec9;
      --color-accent:  #ff9900;
      --font-sans:     'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:     'Amazon Ember Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · AWS Diagram Design</p>
    <h1>AWS migration pyramid · effort vs. value</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyramid-dark-title pyramid-dark-desc">
      <title id="pyramid-dark-title">AWS migration pyramid · effort vs. value</title>
      <desc id="pyramid-dark-desc">Migration pyramid for a 300-application AWS portfolio showing rehost, replatform, refactor, and reinvent strategies ordered by effort and business value, with the application count per layer.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#161e2d"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Left axis: direction of effort -->
        <line x1="100" y1="40" x2="100" y2="320" stroke="rgba(255,255,255,0.30)" stroke-width="1"/>
        <polygon points="96,40 104,40 100,28" fill="rgba(255,255,255,0.45)"/>
        <text x="80" y="216" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle" transform="rotate(-90 80 216)">MORE EFFORT · MORE VALUE ↑</text>

        <!-- Base layer: Rehost -->
        <polygon points="244,280 756,280 820,344 180,344" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="500" y="308" fill="#ffffff" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Rehost</text>
        <text x="500" y="324" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">lift &amp; shift · AWS MGN</text>
        <text x="836" y="316" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.08em">~180 apps</text>

        <!-- L3: Replatform -->
        <polygon points="308,216 692,216 756,280 244,280" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="500" y="244" fill="#ffffff" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Replatform</text>
        <text x="500" y="260" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">RDS · Fargate · managed</text>
        <text x="776" y="252" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.08em">~80 apps</text>

        <!-- L2: Refactor -->
        <polygon points="372,152 628,152 692,216 308,216" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="500" y="180" fill="#ffffff" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Refactor</text>
        <text x="500" y="196" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">serverless · event-driven</text>
        <text x="716" y="188" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.08em">~32 apps</text>

        <!-- Apex: Reinvent — CORAL FOCAL (true pyramid peak — single triangle, consistent slope with layers below) -->
        <polygon points="500,24 628,152 372,152" fill="rgba(255,153,0,0.10)" stroke="#ff9900" stroke-width="1"/>
        <text x="500" y="120" fill="#ffffff" font-size="12" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Reinvent</text>
        <text x="500" y="136" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">gen AI on Bedrock</text>
        <text x="656" y="112" fill="#ff9900" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.08em">~8 apps</text>

        <!-- Footnote under pyramid -->
        <text x="500" y="384" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">Rehost savings fund the apex. The apex sets the target state.</text>

        <!-- Legend -->
        <line x1="40" y1="436" x2="960" y2="436" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
        <text x="40" y="452" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="464" width="16" height="12" fill="rgba(255,153,0,0.10)" stroke="#ff9900" stroke-width="1"/>
        <text x="64" y="474" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Apex — fewest apps, highest value</text>

        <rect x="280" y="464" width="16" height="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
        <text x="304" y="474" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Supporting layer — the migration volume</text>

        <text x="560" y="474" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">Layer width is honest: narrower = fewer applications.</text>
      </svg>
  </div>
</body>
</html>
