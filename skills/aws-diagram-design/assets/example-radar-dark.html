<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iceberg table storage · Capability radar</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #161e2d;
      --color-ink:     #ffffff;
      --color-muted:   #b6bec9;
      --color-accent:  #ff9900;
      --font-sans:     'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:     'Amazon Ember Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Radar · AWS Diagram Design</p>
    <h1>Iceberg table storage · Capability radar</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radar-dark-title radar-dark-desc">
      <title id="radar-dark-title">Iceberg table storage · Capability radar</title>
      <desc id="radar-dark-desc">Radar chart comparing Amazon S3 Tables, S3 general purpose buckets, HDFS on Amazon EMR, and Amazon FSx for Lustre across five storage capabilities for Iceberg tables.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#161e2d"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Concentric grid rings -->
        <polygon points="500,208 530,230 519,266 481,266 470,230" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
        <polygon points="500,176 561,220 538,292 462,292 439,220" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
        <polygon points="500,144 591,211 556,317 444,317 409,211" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
        <polygon points="500,112 622,201 575,343 425,343 378,201" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
        <polygon points="500,80 652,191 594,369 406,369 348,191" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

        <!-- Axis spokes -->
        <line x1="500" y1="240" x2="500" y2="80" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
        <line x1="500" y1="240" x2="652" y2="191" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
        <line x1="500" y1="240" x2="594" y2="369" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
        <line x1="500" y1="240" x2="406" y2="369" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
        <line x1="500" y1="240" x2="348" y2="191" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

        <!-- Axis labels -->
        <text x="500" y="62" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Small-file handling</text>
        <text x="669" y="189" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">Large-object reads</text>
        <text x="605" y="400" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start">Write throughput</text>
        <text x="395" y="400" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">Operational simplicity</text>
        <text x="331" y="189" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">Iceberg integration</text>

        <!-- Scale ticks -->
        <text x="494" y="82" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">10</text>
        <text x="494" y="114" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">8</text>
        <text x="494" y="146" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">6</text>
        <text x="494" y="178" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">4</text>
        <text x="494" y="210" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">2</text>

        <!-- Non-focal series -->
        <!-- HDFS on EMR · series-2 dusty-blue dark -->
        <polygon points="500,128 606,206 566,330 462,292 409,211" fill="rgba(130,160,192,0.22)" stroke="#82a0c0" stroke-width="1.5"/>
        <!-- FSx for Lustre · series-3 mustard dark -->
        <polygon points="500,144 637,196 575,343 444,317 394,206" fill="rgba(211,173,122,0.22)" stroke="#d3ad7a" stroke-width="1.5"/>
        <!-- S3 general purpose · series-1 sage dark -->
        <polygon points="500,144 652,191 585,356 453,305 378,201" fill="rgba(156,175,143,0.22)" stroke="#9caf8f" stroke-width="1.5"/>

        <!-- Focal series · S3 Tables -->
        <polygon points="500,96 622,201 585,356 415,356 363,196" fill="rgba(255,153,0,0.22)" stroke="#ff9900" stroke-width="1.8"/>

        <!-- Focal vertex dots -->
        <circle cx="500" cy="96"  r="4" fill="#ff9900"/>
        <circle cx="622" cy="201" r="4" fill="#ff9900"/>
        <circle cx="585" cy="356" r="4" fill="#ff9900"/>
        <circle cx="415" cy="356" r="4" fill="#ff9900"/>
        <circle cx="363" cy="196" r="4" fill="#ff9900"/>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40"  y="484" width="16" height="8" fill="rgba(255,153,0,0.22)" stroke="#ff9900" stroke-width="1.5"/>
        <text x="64"  y="492" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">S3 Tables · recommended</text>

        <rect x="220" y="484" width="16" height="8" fill="rgba(156,175,143,0.22)" stroke="#9caf8f" stroke-width="1.5"/>
        <text x="244" y="492" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">S3 general purpose</text>

        <rect x="344" y="484" width="16" height="8" fill="rgba(130,160,192,0.22)" stroke="#82a0c0" stroke-width="1.5"/>
        <text x="368" y="492" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">HDFS on EMR</text>

        <rect x="424" y="484" width="16" height="8" fill="rgba(211,173,122,0.22)" stroke="#d3ad7a" stroke-width="1.5"/>
        <text x="448" y="492" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">FSx for Lustre</text>

        <text x="608" y="492" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">One coral. Position is the signal — color reserved for the recommended option.</text>
      </svg>
  </div>
</body>
</html>
