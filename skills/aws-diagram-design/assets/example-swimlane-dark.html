<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping a CDK change · Swimlane</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #161e2d;
      --color-ink:     #ffffff;
      --color-muted:   #b6bec9;
      --color-accent:  #ff9900;
      --font-sans:     'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:     'Amazon Ember Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · AWS CodePipeline</p>
    <h1>Shipping a CDK change</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swimlane-dark-title swimlane-dark-desc">
      <title id="swimlane-dark-title">Shipping a CDK change</title>
      <desc id="swimlane-dark-desc">Swimlane diagram showing an AWS CDK change moving from developer commit through pull-request review, fixes, approval, then an AWS CodePipeline run that builds in AWS CodeBuild and deploys through AWS CloudFormation.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b6bec9"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff9900"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#161e2d"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Lane dividers -->
        <line x1="40" y1="80" x2="960" y2="80" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
        <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="40" y1="240" x2="960" y2="240" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="40" y1="320" x2="960" y2="320" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="40" y1="400" x2="960" y2="400" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

        <!-- Actor column divider -->
        <line x1="160" y1="80" x2="160" y2="400" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

        <!-- Lane labels -->
        <text x="60" y="124" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">DEVELOPER</text>
        <text x="60" y="204" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">REVIEWER</text>
        <text x="60" y="284" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">APPROVER</text>
        <text x="60" y="364" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">PIPELINE</text>

        <!-- Arrows (drawn first) -->
        <!-- 1. Draft → Open PR (within Author) -->
        <line x1="300" y1="120" x2="340" y2="120" stroke="#b6bec9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2. Open PR → Review (Author → Reviewer handoff: right edge, one turn, down into Review's top) -->
        <path d="M 460,120 H 512 Q 520,120 520,128 V 176" fill="none" stroke="#b6bec9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3. Review → Address notes (Reviewer → Developer, dashed revision detour) -->
        <path d="M 640,200 H 662 Q 670,200 670,192 V 144" fill="none" stroke="#b6bec9" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 4. Address notes → Approve (Developer → Approver, straight down) -->
        <line x1="720" y1="144" x2="720" y2="256" stroke="#b6bec9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5. Approve → Build (Editor → CI/CD, coral handoff, straight down) -->
        <line x1="720" y1="304" x2="720" y2="344" stroke="#ff9900" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 6. Build → Deploy (within CI/CD) -->
        <line x1="760" y1="368" x2="800" y2="368" stroke="#b6bec9" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="528" y="140" width="60" height="12" rx="2" fill="#161e2d"/>
        <text x="558" y="150" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">HANDOFF</text>

        <rect x="644" y="166" width="52" height="12" rx="2" fill="#161e2d"/>
        <text x="670" y="175" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">REVISE</text>

        <rect x="728" y="326" width="80" height="12" rx="2" fill="#161e2d"/>
        <text x="768" y="336" fill="#ff9900" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">SOURCE TRIGGER</text>

        <!-- Steps -->
        <!-- Author: Draft MDX -->
        <rect x="180" y="96" width="120" height="48" rx="6" fill="#232f3e" stroke="#ffffff" stroke-width="1"/>
        <text x="240" y="118" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Write change</text>
        <text x="240" y="132" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">cdk stack update</text>

        <!-- Author: Open PR -->
        <rect x="340" y="96" width="120" height="48" rx="6" fill="#232f3e" stroke="#ffffff" stroke-width="1"/>
        <text x="400" y="118" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Open PR</text>
        <text x="400" y="132" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">cdk diff attached</text>

        <!-- Reviewer: Review content -->
        <rect x="500" y="176" width="140" height="48" rx="6" fill="#232f3e" stroke="#ffffff" stroke-width="1"/>
        <text x="570" y="198" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Review diff</text>
        <text x="570" y="212" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">IAM · cost impact</text>

        <!-- Developer: Address notes -->
        <rect x="600" y="96" width="140" height="48" rx="6" fill="#232f3e" stroke="#ffffff" stroke-width="1"/>
        <text x="670" y="118" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Address notes</text>
        <text x="670" y="132" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">fix · re-run diff</text>

        <!-- Editor: Approve merge -->
        <rect x="680" y="256" width="140" height="48" rx="6" fill="#232f3e" stroke="#ffffff" stroke-width="1"/>
        <text x="750" y="278" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Approve merge</text>
        <text x="750" y="292" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">squash · main</text>

        <!-- CI/CD: Build -->

        <text x="720" y="366" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">Build</text>
        <text x="720" y="380" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">CodeBuild</text>

        <!-- CI/CD: Deploy (coral focal) -->
        <rect x="800" y="344" width="120" height="48" rx="6" fill="rgba(255,153,0,0.08)" stroke="#ff9900" stroke-width="1"/>

        <line x1="40" y1="428" x2="960" y2="428" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
