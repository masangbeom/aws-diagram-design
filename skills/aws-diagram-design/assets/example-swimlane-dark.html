  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #161e2d;
      --color-ink:     #ffffff;
      --color-muted:   #b6bec9;
      --color-accent:  #ff9900;
      --font-sans:     'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:     'Amazon Ember Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;

    <p class="eyebrow">Swimlane · AWS CodePipeline</p>
    <h1>Shipping a CDK change</h1>

      <title id="swimlane-dark-title">Shipping a CDK change</title>
      <desc id="swimlane-dark-desc">Swimlane diagram showing an AWS CDK change moving from developer commit through pull-request review, fixes, approval, then an AWS CodePipeline run that builds in AWS CodeBuild and deploys with AWS CodeDeploy.</desc>

        <text x="60" y="204" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">REVIEWER</text>
        <text x="60" y="284" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">APPROVER</text>
        <text x="60" y="364" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">PIPELINE</text>
