<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lambda p95 duration vs error rate, sized by invocations · Bubble</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #232f3e;
      --color-muted:  #545b64;
      --color-accent: #ec7211;
      --font-sans:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:   'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:    'Amazon Ember Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bubble · AWS Diagram Design</p>
    <h1>The biggest risk is not the slowest function</h1>

    <!-- X: 0-500ms p95 over 880px, x = 80 + 1.76·ms. Y: 0-4% error rate over
         380px, y = 420 - 95·pct. AREA encodes requests per second: r = 1.4·√v,
         so area = π·1.96·v, exactly proportional. scripts/verify-bubble.py
         derives all three maps from the values each bubble declares and flags
         any bubble that disagrees with its peers. -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bubble-title bubble-desc">
      <title id="bubble-title">The biggest risk is not the slowest function</title>
      <desc id="bubble-desc">Bubble chart of nine AWS Lambda functions by p95 duration and error rate on zero-based axes, bubble area proportional to invocations per second; the Payments function carries near-peak traffic at the highest error rate.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(35,47,62,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Axis captions -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#545b64" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">ERROR RATE, %</text>
      <text x="520" y="456" fill="#545b64" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">P95 DURATION, MS</text>

      <!-- Gridlines, same positions as the parent scatter -->
      <line x1="80" y1="325" x2="960" y2="325" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="135" x2="960" y2="135" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(35,47,62,0.06)" stroke-width="0.8"/>
      <line x1="256" y1="40" x2="256" y2="420" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
      <line x1="432" y1="40" x2="432" y2="420" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
      <line x1="608" y1="40" x2="608" y2="420" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>
      <line x1="784" y1="40" x2="784" y2="420" stroke="rgba(35,47,62,0.08)" stroke-width="0.8"/>

      <!-- Axes: both start at zero. A bubble's position is read against the
           origin, so a truncated axis here shifts every bubble's story. -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

      <!-- Tick labels are BOUND: data-tick names the axis, data-value the number
           the tick claims to sit at. verify-bubble.py cross-checks each against
           the scale the bubbles themselves describe, so the printed axis and
           the drawn positions cannot drift apart. -->
      <text data-tick="y" data-value="1" x="72" y="329" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">1</text>
      <text data-tick="y" data-value="2" x="72" y="234" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">2</text>
      <text data-tick="y" data-value="3" x="72" y="139" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">3</text>
      <text data-tick="y" data-value="4" x="72" y="44"  fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">4</text>
      <text data-tick="y" data-value="0" x="72" y="424" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">0</text>

      <text data-tick="x" data-value="0"   x="80"  y="440" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">0</text>
      <text data-tick="x" data-value="100" x="256" y="440" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">100</text>
      <text data-tick="x" data-value="200" x="432" y="440" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">200</text>
      <text data-tick="x" data-value="300" x="608" y="440" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">300</text>
      <text data-tick="x" data-value="400" x="784" y="440" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">400</text>
      <text data-tick="x" data-value="500" x="960" y="440" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">500</text>

      <!-- ─── BUBBLES, drawn LARGEST FIRST so a small bubble can never be buried
           under a big one. AREA carries the third value, never radius: a radius
           proportional to traffic would show a 6x service as 36x the ink. The
           fill ramp runs faintest-on-largest — it compensates ink mass so small
           bubbles stay visible, it is NOT a fourth encoding, and the legend says
           which end is which in skin-neutral terms. Each bubble sits on a paper
           underlay so gridlines do not show through the translucent fill. -->

      <circle cx="229.6" cy="372.5" r="42" fill="#ffffff"/>
      <circle data-name="Router" data-x="85" data-y="0.5" data-size="900" cx="229.6" cy="372.5" r="42" fill="rgba(35,47,62,0.14)" stroke="#545b64" stroke-width="1"/>

      <!-- Payments FOCAL — and it is the risk, not the winner: near-peak traffic
           riding the worst error rate. One accent bubble max; every other
           service stays on the ink ramp. -->
      <circle cx="537.6" cy="154" r="38.6" fill="#ffffff"/>
      <circle data-name="Payments" data-x="260" data-y="2.8" data-size="760" cx="537.6" cy="154" r="38.6" fill="rgba(236,114,17,0.15)" stroke="#ec7211" stroke-width="1.2"/>

      <circle cx="326.4" cy="334.5" r="34.9" fill="#ffffff"/>
      <circle data-name="Authorizer" data-x="140" data-y="0.9" data-size="620" cx="326.4" cy="334.5" r="34.9" fill="rgba(35,47,62,0.17)" stroke="#545b64" stroke-width="1"/>

      <circle cx="396.8" cy="353.5" r="32.5" fill="#ffffff"/>
      <circle data-name="Catalog" data-x="180" data-y="0.7" data-size="540" cx="396.8" cy="353.5" r="32.5" fill="rgba(35,47,62,0.20)" stroke="#545b64" stroke-width="1"/>

      <circle cx="643.2" cy="315.5" r="30.7" fill="#ffffff"/>
      <circle data-name="Search" data-x="320" data-y="1.1" data-size="480" cx="643.2" cy="315.5" r="30.7" fill="rgba(35,47,62,0.23)" stroke="#545b64" stroke-width="1"/>

      <circle cx="484.8" cy="287" r="25.4" fill="#ffffff"/>
      <circle data-name="Thumbnails" data-x="230" data-y="1.4" data-size="330" cx="484.8" cy="287" r="25.4" fill="rgba(35,47,62,0.26)" stroke="#545b64" stroke-width="1"/>

      <circle cx="819.2" cy="268" r="20.3" fill="#ffffff"/>
      <circle data-name="Recommender" data-x="420" data-y="1.6" data-size="210" cx="819.2" cy="268" r="20.3" fill="rgba(35,47,62,0.29)" stroke="#545b64" stroke-width="1"/>

      <circle cx="247.2" cy="211" r="17.1" fill="#ffffff"/>
      <circle data-name="Notifier" data-x="95" data-y="2.2" data-size="150" cx="247.2" cy="211" r="17.1" fill="rgba(35,47,62,0.32)" stroke="#545b64" stroke-width="1"/>

      <circle cx="889.6" cy="334.5" r="10.8" fill="#ffffff"/>
      <circle data-name="Reports" data-x="460" data-y="0.9" data-size="60" cx="889.6" cy="334.5" r="10.8" fill="rgba(35,47,62,0.35)" stroke="#545b64" stroke-width="1"/>

      <!-- Labels: the focal bubble plus the two poles of the area story — the
           giant that is healthy and the sliver that is slow. Each label is
           bound to its bubble by data-name, so verify-bubble.py can prove it
           sits nearer its own bubble than anyone else's. -->
      <rect x="506" y="99" width="64" height="12" rx="2" fill="#ffffff"/>
      <text data-name="Payments" data-role="label" x="538" y="108" fill="#232f3e" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PAYMENTS</text>

      <rect x="198" y="316" width="64" height="12" rx="2" fill="#ffffff"/>
      <text data-name="Router" data-role="label" x="230" y="325" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ROUTER</text>

      <rect x="858" y="347" width="64" height="12" rx="2" fill="#ffffff"/>
      <text data-name="Reports" data-role="label" x="890" y="356" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPORTS</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="960" y="478" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.06em" text-anchor="end">LAMBDA P95 DURATION VS ERROR RATE, BUBBLE AREA ∝ INVOCATIONS PER SECOND · BOTH AXES START AT ZERO · ILLUSTRATIVE FIGURES, NOT MEASURED FUNCTIONS</text>

      <circle cx="52" cy="490" r="6" fill="rgba(236,114,17,0.15)" stroke="#ec7211" stroke-width="1.2"/>
      <text x="68" y="494" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Payments · focal, highest error rate at near-peak traffic</text>
      <circle cx="660" cy="490" r="5" fill="rgba(35,47,62,0.23)" stroke="#545b64" stroke-width="1"/>
      <text x="676" y="494" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Lambda function · faintest fill is the largest bubble</text>
    </svg>
  </div>
</body>
</html>
