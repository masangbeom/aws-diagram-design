<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Lambda invocations · Line chart · dark</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#161e2d; --color-ink:#ffffff; --color-muted:#b6bec9; --color-accent:#ff9900; --font-sans:'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --font-serif:'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --font-mono:'Amazon Ember Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line · AWS Diagram Design</p>
    <h1>Lambda invocations · API Gateway leads the growth</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="line-dark-title line-dark-desc">
      <title id="line-dark-title">Lambda invocations · API Gateway leads the growth</title>
      <desc id="line-dark-desc">Line chart showing weekly AWS Lambda invocations in millions by trigger source, API Gateway, SQS and EventBridge, across weeks W1 through W8.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#161e2d"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#b6bec9" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">INVOCATIONS · M / WEEK</text>

      <!-- Gridlines -->
      <line x1="80" y1="357" x2="960" y2="357" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="293" x2="960" y2="293" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="167" x2="960" y2="167" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="103" x2="960" y2="103" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>

      <!-- Axes -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

      <!-- Y-axis labels -->
      <text x="72" y="361" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">40</text>
      <text x="72" y="297" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">80</text>
      <text x="72" y="234" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">120</text>
      <text x="72" y="171" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">160</text>
      <text x="72" y="107" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">200</text>
      <text x="72" y="44"  fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">240</text>

      <!-- ─── SERIES (non-focal drawn first) ─── -->
      <!-- Referral: [45,52,48,60,55,68,62,75] series-2 dusty-blue -->
      <polyline points="80,349 200,338 320,344 440,325 560,333 680,312 800,322 920,301"
                fill="none" stroke="#8fb4e3" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Direct: [80,82,88,90,86,92,95,98] series-1 sage -->
      <polyline points="80,293 200,290 320,281 440,278 560,284 680,274 800,270 920,265"
                fill="none" stroke="#b4cf96" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Organic FOCAL line: [120,135,148,162,155,178,195,210] accent -->
      <polyline points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88"
                fill="none" stroke="#ff9900" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- Focal vertex dots -->
      <circle cx="80"  cy="230" r="4" fill="#ff9900"/>
      <circle cx="200" cy="206" r="4" fill="#ff9900"/>
      <circle cx="320" cy="186" r="4" fill="#ff9900"/>
      <circle cx="440" cy="164" r="4" fill="#ff9900"/>
      <circle cx="560" cy="175" r="4" fill="#ff9900"/>
      <circle cx="680" cy="138" r="4" fill="#ff9900"/>
      <circle cx="800" cy="111" r="4" fill="#ff9900"/>
      <circle cx="920" cy="88"  r="4" fill="#ff9900"/>

      <!-- X-axis labels -->
      <text x="80"  y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W1</text>
      <text x="200" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W2</text>
      <text x="320" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W3</text>
      <text x="440" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W4</text>
      <text x="560" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W5</text>
      <text x="680" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W6</text>
      <text x="800" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W7</text>
      <text x="920" y="440" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">W8</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="492" x2="64" y2="492" stroke="#ff9900" stroke-width="1.8"/>
      <circle cx="52" cy="492" r="4" fill="#ff9900"/>
      <text x="72" y="496" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">API Gateway · focal</text>

      <line x1="200" y1="492" x2="224" y2="492" stroke="#b4cf96" stroke-width="1.2"/>
      <text x="232" y="496" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">SQS</text>

      <line x1="316" y1="492" x2="340" y2="492" stroke="#8fb4e3" stroke-width="1.2"/>
      <text x="348" y="496" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">EventBridge</text>
    </svg>
  </div>
</body>
</html>
