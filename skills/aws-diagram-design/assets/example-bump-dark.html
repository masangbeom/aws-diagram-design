<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EC2 instance family rank by quarter · Bump chart</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #161e2d;
      --color-ink:    #ffffff;
      --color-muted:  #b6bec9;
      --color-accent: #ff9900;
      --font-sans:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:   'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:    'Amazon Ember Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bump chart · AWS Diagram Design</p>
    <h1>The default everyone stopped choosing</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bump-dark-title bump-dark-desc">
      <title id="bump-dark-title">The default everyone stopped choosing</title>
      <desc id="bump-dark-desc">Bump chart ranking six Amazon EC2 instance families by fleet vCPU-hours across four quarters; m5 slides from first to sixth while m7g takes the top rank in the second quarter and keeps it.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#161e2d"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Rank is ORDINAL: every vertex sits exactly on a rank row, y = 88 + 56 x
           (rank - 1), and every snapshot's ranks are a permutation of 1..6.
           scripts/verify-bump.py enforces both against the ranks each series
           declares - there is no tolerance, because rank has no fractions. -->
      <text transform="rotate(-90 24 228)" x="24" y="228" fill="#b6bec9" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">RANK BY FLEET VCPU-HOURS · 1 = MOST</text>

      <!-- One axis rule per snapshot. No gridlines: the dots are the readable
           positions and each series prints its first and last rank. -->
      <line x1="320" y1="64" x2="320" y2="392" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text data-axis="0" data-state="Q1" x="320" y="416" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">Q1</text>
      <line x1="440" y1="64" x2="440" y2="392" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text data-axis="1" data-state="Q2" x="440" y="416" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">Q2</text>
      <line x1="560" y1="64" x2="560" y2="392" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text data-axis="2" data-state="Q3" x="560" y="416" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">Q3</text>
      <line x1="680" y1="64" x2="680" y2="392" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text data-axis="3" data-state="Q4" x="680" y="416" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">Q4</text>

      <!-- Straight segments between adjacent snapshots - never splines, which
           invent a trajectory between ranks that were only measured quarterly.
           Ramp ordered by Q1 rank: opacity records the opening order. -->
      <path data-series="c6i" data-ranks="2,3,3,2" d="M320,144 L440,200 L560,200 L680,144" fill="none" stroke="rgba(255,255,255,0.80)" stroke-width="1.2"/>
      <circle cx="320" cy="144" r="3" fill="rgba(255,255,255,0.80)"/>
      <circle cx="440" cy="200" r="3" fill="rgba(255,255,255,0.80)"/>
      <circle cx="560" cy="200" r="3" fill="rgba(255,255,255,0.80)"/>
      <circle cx="680" cy="144" r="3" fill="rgba(255,255,255,0.80)"/>
      <text data-series="c6i" data-end="first" data-role="name" x="272" y="147.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">c6i</text>
      <text data-series="c6i" data-end="first" data-role="rank" x="304" y="147.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">#2</text>
      <text data-series="c6i" data-end="last" data-role="rank" x="696" y="147.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">#2</text>
      <text data-series="c6i" data-end="last" data-role="name" x="728" y="147.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">c6i</text>

      <path data-series="m7g" data-ranks="3,1,1,1" d="M320,200 L440,88 L560,88 L680,88" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.2"/>
      <circle cx="320" cy="200" r="3" fill="rgba(255,255,255,0.75)"/>
      <circle cx="440" cy="88" r="3" fill="rgba(255,255,255,0.75)"/>
      <circle cx="560" cy="88" r="3" fill="rgba(255,255,255,0.75)"/>
      <circle cx="680" cy="88" r="3" fill="rgba(255,255,255,0.75)"/>
      <text data-series="m7g" data-end="first" data-role="name" x="272" y="203.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">m7g</text>
      <text data-series="m7g" data-end="first" data-role="rank" x="304" y="203.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">#3</text>
      <text data-series="m7g" data-end="last" data-role="rank" x="696" y="91.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">#1</text>
      <text data-series="m7g" data-end="last" data-role="name" x="728" y="91.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">m7g</text>

      <path data-series="r6i" data-ranks="4,5,5,4" d="M320,256 L440,312 L560,312 L680,256" fill="none" stroke="rgba(255,255,255,0.70)" stroke-width="1.2"/>
      <circle cx="320" cy="256" r="3" fill="rgba(255,255,255,0.70)"/>
      <circle cx="440" cy="312" r="3" fill="rgba(255,255,255,0.70)"/>
      <circle cx="560" cy="312" r="3" fill="rgba(255,255,255,0.70)"/>
      <circle cx="680" cy="256" r="3" fill="rgba(255,255,255,0.70)"/>
      <text data-series="r6i" data-end="first" data-role="name" x="272" y="259.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">r6i</text>
      <text data-series="r6i" data-end="first" data-role="rank" x="304" y="259.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">#4</text>
      <text data-series="r6i" data-end="last" data-role="rank" x="696" y="259.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">#4</text>
      <text data-series="r6i" data-end="last" data-role="name" x="728" y="259.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">r6i</text>

      <path data-series="t3" data-ranks="5,4,2,3" d="M320,312 L440,256 L560,144 L680,200" fill="none" stroke="rgba(255,255,255,0.66)" stroke-width="1.2"/>
      <circle cx="320" cy="312" r="3" fill="rgba(255,255,255,0.66)"/>
      <circle cx="440" cy="256" r="3" fill="rgba(255,255,255,0.66)"/>
      <circle cx="560" cy="144" r="3" fill="rgba(255,255,255,0.66)"/>
      <circle cx="680" cy="200" r="3" fill="rgba(255,255,255,0.66)"/>
      <text data-series="t3" data-end="first" data-role="name" x="272" y="315.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">t3</text>
      <text data-series="t3" data-end="first" data-role="rank" x="304" y="315.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">#5</text>
      <text data-series="t3" data-end="last" data-role="rank" x="696" y="203.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">#3</text>
      <text data-series="t3" data-end="last" data-role="name" x="728" y="203.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">t3</text>

      <path data-series="c7g" data-ranks="6,6,6,5" d="M320,368 L440,368 L560,368 L680,312" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.2"/>
      <circle cx="320" cy="368" r="3" fill="rgba(255,255,255,0.62)"/>
      <circle cx="440" cy="368" r="3" fill="rgba(255,255,255,0.62)"/>
      <circle cx="560" cy="368" r="3" fill="rgba(255,255,255,0.62)"/>
      <circle cx="680" cy="312" r="3" fill="rgba(255,255,255,0.62)"/>
      <text data-series="c7g" data-end="first" data-role="name" x="272" y="371.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">c7g</text>
      <text data-series="c7g" data-end="first" data-role="rank" x="304" y="371.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">#6</text>
      <text data-series="c7g" data-end="last" data-role="rank" x="696" y="315.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">#5</text>
      <text data-series="c7g" data-end="last" data-role="name" x="728" y="315.5" fill="#ffffff" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">c7g</text>

      <!-- m5 FOCAL - and it is the series that FELL. The accent marks the
           editorially focal line, never the winner. Focus is carried by stroke
           weight, not tone, for the reason the slopegraph section gives: the
           accent measures 4.71:1 on light paper, mid-ramp. Drawn last so its descent
           crosses over, not under, the lines it overtakes downward. -->
      <path data-series="m5" data-ranks="1,2,4,6" d="M320,88 L440,144 L560,256 L680,368" fill="none" stroke="#ff9900" stroke-width="2.4"/>
      <circle cx="320" cy="88" r="4" fill="#ff9900"/>
      <circle cx="440" cy="144" r="4" fill="#ff9900"/>
      <circle cx="560" cy="256" r="4" fill="#ff9900"/>
      <circle cx="680" cy="368" r="4" fill="#ff9900"/>
      <text data-series="m5" data-end="first" data-role="name" x="272" y="91.5" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">m5</text>
      <text data-series="m5" data-end="first" data-role="rank" x="304" y="91.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">#1</text>
      <text data-series="m5" data-end="last" data-role="rank" x="696" y="371.5" fill="#b6bec9" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">#6</text>
      <text data-series="m5" data-end="last" data-role="name" x="728" y="371.5" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">m5</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="960" y="478" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.06em" text-anchor="end">RANKED BY FLEET VCPU-HOURS, TIES KEEP PRIOR ORDER · SAME MEASURE EVERY QUARTER · ILLUSTRATIVE FIGURES, NOT A MEASURED FLEET</text>

      <line x1="40" y1="492" x2="64" y2="492" stroke="#ff9900" stroke-width="2.4"/>
      <circle cx="52" cy="492" r="4" fill="#ff9900"/>
      <text x="72" y="496" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">m5 · focal, first to sixth in a year</text>
      <line x1="320" y1="492" x2="344" y2="492" stroke="rgba(255,255,255,0.80)" stroke-width="1.2"/>
      <circle cx="332" cy="492" r="3" fill="rgba(255,255,255,0.80)"/>
      <text x="352" y="496" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Other families · opacity records the Q1 order</text>
    </svg>
  </div>
</body>
</html>
