  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#161e2d; --paper-2:#232f3e; --ink:#ffffff; --muted:#b6bec9; --soft:#8d99a8; --rule:rgba(255,255,255,0.12); --accent:#ff9900; --link:#539fe5; --sans:'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --serif:'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; --mono:'Amazon Ember Mono', ui-monospace, monospace; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    .frame { width:100%; max-width:1200px; }
    .eyebrow { margin-bottom:.5rem; color:var(--muted); font:500 .66rem/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:.35rem; color:var(--ink); font:700 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif); letter-spacing:-.02em; }
    .subtitle { margin-bottom:1.5rem; color:var(--muted); font-size:.9rem; line-height:1.5; }
    .diagram { overflow-x:auto; } svg { display:block; width:100%; min-width:920px; }
    svg .zone { fill:rgba(255,255,255,.04); stroke:rgba(255,255,255,.14); stroke-width:.8; }
    svg .zone-mask, svg .node-mask, svg .label-mask { fill:#161e2d; }
    svg .zone-label, svg .arrow-label, svg .legend-label { font-family:'Amazon Ember Mono', ui-monospace, monospace; }
    svg .zone-label { fill:rgba(255,255,255,.40); font-size:8px; letter-spacing:.14em; }
    svg .node { fill:rgba(255,255,255,.04); stroke:rgba(255,255,255,.32); stroke-width:1; }
    svg .node.external { stroke:#b6bec9; stroke-dasharray:4 3; }
    svg .node.focal { fill:rgba(255,153,0,.12); stroke:#ff9900; stroke-width:1.4; }
    svg .node.survivor { fill:rgba(156,175,143,.10); stroke:rgba(156,175,143,.55); }
    svg .node-name { fill:#ffffff; font:600 12px 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    svg .node-name.survivor { fill:#9caf8f; }
    svg .sub { fill:#b6bec9; font:400 10px 'Amazon Ember Mono', ui-monospace, monospace; } svg .sub.focal { fill:#ff9900; }
    svg .arrow-label { font-size:8px; font-weight:600; letter-spacing:.08em; } svg .legend-label { fill:#b6bec9; font-size:8px; }
