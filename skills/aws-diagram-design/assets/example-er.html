<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce orders · Aurora ER model</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #232f3e;
      --color-muted:   #545b64;
      --color-accent:  #ec7211;
      --font-sans:     'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:     'Amazon Ember Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · AWS Diagram Design</p>
    <h1>E-commerce orders · Aurora data model</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">E-commerce orders · Aurora data model</title>
      <desc id="er-desc">Entity-relationship diagram for an e-commerce order service on Amazon Aurora PostgreSQL: Cognito-identified customers place orders, and order lines join each order to its products.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(35,47,62,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545b64"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationship lines (drawn first) -->
        <!-- 1. Customer — Order (1:N "places") -->
        <line x1="260" y1="240" x2="400" y2="240" stroke="#545b64" stroke-width="1" />
        <!-- 2. Order — OrderLine (1:N) -->
        <path d="M 640,320 H 702 Q 710,320 710,328 H 780" fill="none" stroke="#545b64" stroke-width="1"/>
        <!-- 3. Product — OrderLine (1:N, vertical) -->
        <line x1="880" y1="248" x2="880" y2="280" stroke="#545b64" stroke-width="1" />

        <!-- Cardinality labels -->
        <rect x="266" y="232" width="12" height="12" rx="2" fill="#ffffff"/>
        <text x="272" y="242" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="378" y="232" width="16" height="12" rx="2" fill="#ffffff"/>
        <text x="386" y="242" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="646" y="316" width="12" height="12" rx="2" fill="#ffffff"/>
        <text x="652" y="326" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="760" y="324" width="16" height="12" rx="2" fill="#ffffff"/>
        <text x="768" y="334" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="872" y="252" width="16" height="12" rx="2" fill="#ffffff"/>
        <text x="880" y="262" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="872" y="268" width="16" height="12" rx="2" fill="#ffffff"/>
        <text x="880" y="278" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">N</text>

        <!-- Relationship labels -->
        <rect x="304" y="220" width="56" height="14" rx="2" fill="#ffffff"/>
        <text x="332" y="230" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">PLACES</text>

        <rect x="688" y="300" width="56" height="14" rx="2" fill="#ffffff"/>
        <text x="716" y="310" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">CONTAINS</text>

        <!-- Entity: Customer -->
        <rect x="60" y="160" width="200" height="160" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
        <rect x="60" y="160" width="200" height="40" rx="6" fill="rgba(35,47,62,0.04)" stroke="none"/>
        <rect x="60" y="192" width="200" height="8" fill="rgba(35,47,62,0.04)"/>
        <line x1="60" y1="200" x2="260" y2="200" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
        <text x="76" y="176" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="76" y="192" fill="#232f3e" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Customer</text>
        <text x="76" y="220" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace"># id</text>
        <text x="220" y="220" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="76" y="240" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">cognito_sub</text>
        <text x="220" y="240" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="76" y="260" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">email</text>
        <text x="220" y="260" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="76" y="280" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">name</text>
        <text x="220" y="280" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="76" y="300" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">created_at</text>
        <text x="220" y="300" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">timestamp</text>

        <!-- Entity: Order (focal coral) -->
        <rect x="400" y="120" width="240" height="240" rx="6" fill="rgba(236,114,17,0.04)" stroke="#ec7211" stroke-width="1"/>
        <rect x="400" y="120" width="240" height="40" rx="6" fill="rgba(236,114,17,0.10)" stroke="none"/>
        <rect x="400" y="152" width="240" height="8" fill="rgba(236,114,17,0.10)"/>
        <line x1="400" y1="160" x2="640" y2="160" stroke="rgba(236,114,17,0.40)" stroke-width="1"/>
        <text x="416" y="136" fill="#232f3e" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="416" y="152" fill="#232f3e" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Order</text>
        <text x="416" y="180" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace"># id</text>
        <text x="600" y="180" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="416" y="200" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">order_no</text>
        <text x="600" y="200" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="416" y="220" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">idempotency_key</text>
        <text x="600" y="220" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text · unique</text>
        <text x="416" y="240" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">total_cents</text>
        <text x="600" y="240" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">bigint</text>
        <text x="416" y="260" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">placed_at</text>
        <text x="600" y="260" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">timestamp</text>
        <text x="416" y="280" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">→ customer_id</text>
        <text x="600" y="280" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="416" y="300" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">status</text>
        <text x="600" y="300" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">enum</text>
        <text x="416" y="320" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">receipt_key</text>
        <text x="600" y="320" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text · S3 key</text>

        <!-- Entity: Product -->
        <rect x="780" y="120" width="200" height="128" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
        <rect x="780" y="120" width="200" height="40" rx="6" fill="rgba(35,47,62,0.04)" stroke="none"/>
        <rect x="780" y="152" width="200" height="8" fill="rgba(35,47,62,0.04)"/>
        <line x1="780" y1="160" x2="980" y2="160" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
        <text x="796" y="136" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="796" y="152" fill="#232f3e" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Product</text>
        <text x="796" y="180" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace"># id</text>
        <text x="940" y="180" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="796" y="200" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">sku</text>
        <text x="940" y="200" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text · unique</text>
        <text x="796" y="220" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">name</text>
        <text x="940" y="220" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">text</text>
        <text x="796" y="240" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">price_cents</text>
        <text x="940" y="240" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">bigint</text>

        <!-- Entity: OrderLine (join) -->
        <rect x="780" y="280" width="200" height="96" rx="6" fill="rgba(35,47,62,0.04)" stroke="#545b64" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="780" y="280" width="200" height="40" rx="6" fill="rgba(35,47,62,0.06)" stroke="none"/>
        <rect x="780" y="312" width="200" height="8" fill="rgba(35,47,62,0.06)"/>
        <line x1="780" y1="320" x2="980" y2="320" stroke="rgba(35,47,62,0.22)" stroke-width="1"/>
        <text x="796" y="296" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em">JOIN</text>
        <text x="796" y="312" fill="#232f3e" font-size="14" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">OrderLine</text>
        <text x="796" y="340" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">→ order_id</text>
        <text x="940" y="340" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>
        <text x="796" y="360" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace">→ product_id</text>
        <text x="940" y="360" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">uuid</text>

        <!-- Legend -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(236,114,17,0.04)" stroke="#ec7211" stroke-width="1"/>
        <text x="60" y="444" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Aggregate root</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#232f3e" stroke-width="1"/>
        <text x="200" y="444" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Entity</text>

        <rect x="268" y="436" width="14" height="10" rx="2" fill="rgba(35,47,62,0.04)" stroke="#545b64" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="288" y="444" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Join table</text>

        <text x="372" y="444" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" font-weight="600">#</text>
        <text x="388" y="444" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Primary key</text>

        <text x="476" y="444" fill="#232f3e" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" font-weight="600">→</text>
        <text x="492" y="444" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Foreign key</text>

        <text x="584" y="444" fill="#545b64" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" font-weight="600">1 / N</text>
        <text x="616" y="444" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Cardinality</text>
      </svg>
  </div>
</body>
</html>
