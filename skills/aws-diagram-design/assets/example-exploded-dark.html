<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-tier app on AWS · Three layers, one product</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #161e2d;
      --color-ink:     #ffffff;
      --color-muted:   #b6bec9;
      --color-accent:  #ff9900;
      --font-sans:     'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:     'Amazon Ember Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Exploded axonometric · AWS Diagram Design</p>
    <h1>Three-tier app on AWS · Three layers, one product</h1>

    <div class="diagram-container">

        <g data-part="interface" data-name="Web tier" data-rect="0 0 200 200 12" data-z="232" data-t="16" data-level="2"><path data-role="silhouette" d="M 151.03 136 A 16.97 8.49 0 0 1 156 130 L 332 42 A 16.97 8.49 0 0 1 356 42 L 532 130 A 16.97 8.49 0 0 1 536.97 136 L 536.97 152 A 16.97 8.49 0 0 1 532 158 L 356 246 A 16.97 8.49 0 0 1 332 246 L 156 158 A 16.97 8.49 0 0 1 151.03 152 Z" fill="#232f3e"/><path d="M 356 230 A 16.97 8.49 0 0 1 332 230 L 156 142 A 16.97 8.49 0 0 1 156 130 L 332 42 A 16.97 8.49 0 0 1 356 42 L 532 130 A 16.97 8.49 0 0 1 532 142 Z" fill="rgba(255,255,255,0.10)"/><path d="M 344 232.49 A 16.97 8.49 0 0 0 356 230 L 532 142 A 16.97 8.49 0 0 0 536.97 136 L 536.97 152 A 16.97 8.49 0 0 1 532 158 L 356 246 A 16.97 8.49 0 0 1 344 248.49 Z" fill="rgba(22,30,45,0.45)"/><path d="M 151.03 136 A 16.97 8.49 0 0 0 156 142 L 332 230 A 16.97 8.49 0 0 0 356 230 L 532 142 A 16.97 8.49 0 0 0 536.97 136" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.8"/><path d="M 151.03 136 A 16.97 8.49 0 0 1 156 130 L 332 42 A 16.97 8.49 0 0 1 356 42 L 532 130 A 16.97 8.49 0 0 1 536.97 136 L 536.97 152 A 16.97 8.49 0 0 1 532 158 L 356 246 A 16.97 8.49 0 0 1 332 246 L 156 158 A 16.97 8.49 0 0 1 151.03 152 Z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/><g data-role="label"><line data-role="leader" x1="542.97" y1="144" x2="588.97" y2="144" stroke="rgba(255,255,255,0.40)" stroke-width="0.8"/><circle cx="536.97" cy="144" r="2" fill="#ffffff"/><text data-role="name" x="600.97" y="143" fill="#ffffff" font-size="16" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Web tier</text><text x="600.97" y="159" fill="#b6bec9" font-size="10" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.08em">CloudFront, S3 static site</text></g></g>
        </g>
        <text x="152" y="528" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">FOCAL LAYER</text>
        <text x="256" y="528" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">The app tier is where the product decisions live; the data and web tiers are swappable.</text>
      </svg>
    </div>
  </div>
</body>
</html>
