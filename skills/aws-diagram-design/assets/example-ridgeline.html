<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request latency by AWS backend · Ridgeline</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #232f3e;
      --color-muted:  #545b64;
      --color-accent: #ec7211;
      --font-sans:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:   'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:    'Amazon Ember Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ridgeline · AWS Diagram Design</p>
    <h1>The order Lambda is slow in two different ways</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ridgeline-title ridgeline-desc">
      <title id="ridgeline-title">The order Lambda is slow in two different ways</title>
      <desc id="ridgeline-desc">Ridgeline chart of request-latency distributions for five AWS-backed endpoints over one week; each ridge is the share of that service's requests falling in 40-millisecond bins, drawn on one shared amplitude scale, and order-lambda carries a second peak past 300 milliseconds that none of the other four show.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(35,47,62,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ONE amplitude on every ridge: y = baseline - 2.4 x (share in %). Per-ridge
           normalisation would let a rare, flat distribution wear the same silhouette
           as a tight one, which is the single lie this type is built to tell.
           scripts/verify-ridgeline.py derives the amplitude from the figure and then
           holds every vertex of every ridge to it. -->
      <text transform="rotate(-90 24 264)" x="24" y="264" fill="#545b64" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">SHARE OF REQUESTS · 1% = 2.4PX ON EVERY RIDGE</text>

      <!-- One baseline per ridge, 56px pitch. The baseline is where a bin of zero
           requests sits, so it can never be moved to give a ridge more room. -->
      <line data-ridge="cloudfront" data-role="baseline" x1="320" y1="152" x2="680" y2="152" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
      <line data-ridge="cognito-auth" data-role="baseline" x1="320" y1="208" x2="680" y2="208" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
      <line data-ridge="opensearch" data-role="baseline" x1="320" y1="264" x2="680" y2="264" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
      <line data-ridge="order-lambda" data-role="baseline" x1="320" y1="320" x2="680" y2="320" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>
      <line data-ridge="bedrock-embed" data-role="baseline" x1="320" y1="376" x2="680" y2="376" stroke="rgba(35,47,62,0.25)" stroke-width="1"/>

      <!-- Shared x-scale: every ridge is sampled at the same 13 bins, 40ms wide,
           labelled at the lower edge. Straight segments between bins - no smoothing,
           because a spline through 13 bins invents extrema the sample never had. -->
      <path data-ridge="cloudfront" data-baseline="152" data-bins="0,26,34,21,11,5,2,1,0,0,0,0,0" d="M320,152 L350,89.6 L380,70.4 L410,101.6 L440,125.6 L470,140 L500,147.2 L530,149.6 L560,152 L590,152 L620,152 L650,152 L680,152 Z" fill="rgba(35,47,62,0.12)" stroke="rgba(35,47,62,0.80)" stroke-width="1.2" stroke-linejoin="round"/>
      <text data-ridge="cloudfront" data-role="name" x="304" y="155.5" fill="#232f3e" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">cloudfront</text>
      <text data-ridge="cloudfront" data-role="range" x="696" y="155.5" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">40–280 ms</text>
      <path data-ridge="cognito-auth" data-baseline="208" data-bins="0,6,28,36,18,7,3,1,1,0,0,0,0" d="M320,208 L350,193.6 L380,140.8 L410,121.6 L440,164.8 L470,191.2 L500,200.8 L530,205.6 L560,205.6 L590,208 L620,208 L650,208 L680,208 Z" fill="rgba(35,47,62,0.12)" stroke="rgba(35,47,62,0.74)" stroke-width="1.2" stroke-linejoin="round"/>
      <text data-ridge="cognito-auth" data-role="name" x="304" y="211.5" fill="#232f3e" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">cognito-auth</text>
      <text data-ridge="cognito-auth" data-role="range" x="696" y="211.5" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">40–320 ms</text>
      <path data-ridge="opensearch" data-baseline="264" data-bins="0,1,9,22,27,19,11,6,3,1,1,0,0" d="M320,264 L350,261.6 L380,242.4 L410,211.2 L440,199.2 L470,218.4 L500,237.6 L530,249.6 L560,256.8 L590,261.6 L620,261.6 L650,264 L680,264 Z" fill="rgba(35,47,62,0.12)" stroke="rgba(35,47,62,0.68)" stroke-width="1.2" stroke-linejoin="round"/>
      <text data-ridge="opensearch" data-role="name" x="304" y="267.5" fill="#232f3e" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">opensearch</text>
      <text data-ridge="opensearch" data-role="range" x="696" y="267.5" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">40–400 ms</text>

      <!-- order-lambda FOCAL - and it is the ridge whose SHAPE is the story,
           not the slowest service. Drawn last so its second peak reads over the
           ridge below it rather than under. -->
      <path data-ridge="order-lambda" data-baseline="320" data-bins="0,1,6,17,21,14,8,6,7,9,7,4,0" d="M320,320 L350,317.6 L380,305.6 L410,279.2 L440,269.6 L470,286.4 L500,300.8 L530,305.6 L560,303.2 L590,298.4 L620,303.2 L650,310.4 L680,320 Z" fill="rgba(236,114,17,0.16)" stroke="#ec7211" stroke-width="2.4" stroke-linejoin="round"/>
      <text data-ridge="order-lambda" data-role="name" x="304" y="323.5" fill="#232f3e" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">order-lambda</text>
      <text data-ridge="order-lambda" data-role="range" x="696" y="323.5" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">40–440 ms</text>
      <path data-ridge="bedrock-embed" data-baseline="376" data-bins="0,0,1,3,7,12,17,19,16,12,9,4,0" d="M320,376 L350,376 L380,373.6 L410,368.8 L440,359.2 L470,347.2 L500,335.2 L530,330.4 L560,337.6 L590,347.2 L620,354.4 L650,366.4 L680,376 Z" fill="rgba(35,47,62,0.12)" stroke="rgba(35,47,62,0.62)" stroke-width="1.2" stroke-linejoin="round"/>
      <text data-ridge="bedrock-embed" data-role="name" x="304" y="379.5" fill="#232f3e" font-size="11" font-weight="500" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">bedrock-embed</text>
      <text data-ridge="bedrock-embed" data-role="range" x="696" y="379.5" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace">80–440 ms</text>

      <!-- Bin ticks on the shared latency scale. data-bin binds the printed number,
           so a caption cannot be edited without its binding. -->
      <text data-tick="0" data-bin="0" x="320" y="400" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">0</text>
      <text data-tick="1" data-bin="120" x="410" y="400" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">120</text>
      <text data-tick="2" data-bin="240" x="500" y="400" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">240</text>
      <text data-tick="3" data-bin="360" x="590" y="400" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">360</text>
      <text data-tick="4" data-bin="480" x="680" y="400" fill="#545b64" font-size="9" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">480</text>
      <text x="500" y="424" fill="#545b64" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em" text-anchor="middle">REQUEST LATENCY (MS), BIN LOWER EDGE</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(35,47,62,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="960" y="478" fill="#545b64" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.06em" text-anchor="end">SHARE OF EACH ENDPOINT'S OWN REQUESTS PER 40 MS BIN · 1% = 2.4PX ON EVERY RIDGE · UNSMOOTHED · ILLUSTRATIVE FIGURES</text>

      <rect x="40" y="486" width="24" height="10" fill="rgba(236,114,17,0.16)"/>
      <line x1="40" y1="486" x2="64" y2="486" stroke="#ec7211" stroke-width="2.4"/>
      <text x="72" y="496" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">order-lambda · focal, second peak past 300 ms</text>
      <rect x="360" y="486" width="24" height="10" fill="rgba(35,47,62,0.12)"/>
      <line x1="360" y1="486" x2="384" y2="486" stroke="rgba(35,47,62,0.80)" stroke-width="1.2"/>
      <text x="392" y="496" fill="#545b64" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Other endpoints · ordered by median, fastest at top</text>
    </svg>
  </div>
</body>
</html>
