<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly AWS spend · Bar chart · dark</title>
  <style>
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: normal; src: local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 700; font-style: normal; src: local('Amazon Ember Bold'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_Bd.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 400; font-style: normal; src: local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Rg.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember Mono'; font-weight: 700; font-style: normal; src: local('Amazon Ember Mono Bold'), local('Amazon Ember Mono'), url('fonts/woff2/AmazonEmberMono_W_Bd.woff2') format('woff2'); }
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #161e2d;
      --color-ink:    #ffffff;
      --color-muted:  #b6bec9;
      --color-accent: #ff9900;
      --font-sans:    'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-serif:   'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:    'Amazon Ember Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · AWS Diagram Design</p>
    <h1>Monthly AWS spend · Jan–Aug, $K</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bar-dark-title bar-dark-desc">
      <title id="bar-dark-title">Monthly AWS spend · Jan–Aug, $K</title>
      <desc id="bar-dark-desc">Bar chart showing monthly AWS spend in thousands of dollars from January through August, with May as the peak month at $110K.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(255,255,255,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#b6bec9" font-size="7" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">SPEND · $K</text>

      <!-- Horizontal gridlines (drawn before bars) -->
      <line x1="80" y1="357" x2="960" y2="357" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="293" x2="960" y2="293" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="167" x2="960" y2="167" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="103" x2="960" y2="103" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>

      <!-- Y-axis line and X-axis baseline -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

      <!-- Y-axis tick labels -->
      <text x="72" y="361" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">20</text>
      <text x="72" y="297" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">40</text>
      <text x="72" y="234" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">60</text>
      <text x="72" y="171" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">80</text>
      <text x="72" y="107" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">100</text>
      <text x="72" y="44"  fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="end">120</text>

      <!-- ─── BARS (pitch=110, width=72, pad=19) ─── -->
      <!-- S1: v=72, h=228, y=192 -->
      <rect x="99" y="192" width="72" height="228" fill="#ffffff"/>
      <rect x="99" y="192" width="72" height="228" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="135" y="184" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">72</text>

      <!-- S2: v=88, h=280, y=140 -->
      <rect x="209" y="140" width="72" height="280" fill="#ffffff"/>
      <rect x="209" y="140" width="72" height="280" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="245" y="132" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">88</text>

      <!-- S3: v=95, h=300, y=120 -->
      <rect x="319" y="120" width="72" height="300" fill="#ffffff"/>
      <rect x="319" y="120" width="72" height="300" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="355" y="112" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">95</text>

      <!-- S4: v=78, h=248, y=172 -->
      <rect x="429" y="172" width="72" height="248" fill="#ffffff"/>
      <rect x="429" y="172" width="72" height="248" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="465" y="164" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">78</text>

      <!-- S5 FOCAL: v=110, h=348, y=72 -->
      <rect x="539" y="72" width="72" height="348" fill="#ffffff"/>
      <rect x="539" y="72" width="72" height="348" fill="rgba(255,153,0,0.14)" stroke="#ff9900" stroke-width="1"/>
      <text x="575" y="64" fill="#ff9900" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600">110</text>

      <!-- S6: v=102, h=324, y=96 -->
      <rect x="649" y="96" width="72" height="324" fill="#ffffff"/>
      <rect x="649" y="96" width="72" height="324" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="685" y="88" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">102</text>

      <!-- S7: v=85, h=268, y=152 -->
      <rect x="759" y="152" width="72" height="268" fill="#ffffff"/>
      <rect x="759" y="152" width="72" height="268" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="795" y="144" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">85</text>

      <!-- S8: v=93, h=296, y=124 -->
      <rect x="869" y="124" width="72" height="296" fill="#ffffff"/>
      <rect x="869" y="124" width="72" height="296" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="905" y="116" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" text-anchor="middle">93</text>

      <!-- X-axis category labels -->
      <text x="135" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">JAN</text>
      <text x="245" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">FEB</text>
      <text x="355" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">MAR</text>
      <text x="465" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">APR</text>
      <text x="575" y="440" fill="#ff9900" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">MAY</text>
      <text x="685" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">JUN</text>
      <text x="795" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">JUL</text>
      <text x="905" y="440" fill="#ffffff" font-size="11" font-weight="600" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">AUG</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#b6bec9" font-size="8" font-family="'Amazon Ember Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(255,153,0,0.14)" stroke="#ff9900" stroke-width="1"/>
      <text x="64" y="497" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">May · peak month</text>

      <rect x="220" y="488" width="16" height="10" rx="2" fill="rgba(182,190,201,0.15)" stroke="#b6bec9" stroke-width="1"/>
      <text x="244" y="497" fill="#b6bec9" font-size="8.5" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif">Other months</text>
    </svg>
  </div>
</body>
</html>
