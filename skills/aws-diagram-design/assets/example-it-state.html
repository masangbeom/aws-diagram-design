  @font-face { font-family: 'Amazon Ember'; font-weight: 400; font-style: italic; src: local('Amazon Ember Italic'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_RgIt.woff2') format('woff2'); }
  @font-face { font-family: 'Amazon Ember'; font-weight: 600; font-style: normal; src: local('Amazon Ember Medium'), local('Amazon Ember'), url('fonts/woff2/AmazonEmber_W_SBd.woff2') format('woff2'); }

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #ffffff; --paper-2: #f2f3f3; --ink: #232f3e;
      --muted: #545b64; --soft: #687078; --rule: rgba(35,47,62,0.12);
      --accent: #ec7211; --link: #0972d3;
      --sans: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --serif: 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --mono: 'Amazon Ember Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem/1 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 0.35rem; color: var(--ink); font: 700 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .subtitle { margin-bottom: 1.5rem; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 920px; }
    svg .zone { fill: rgba(35,47,62,0.02); stroke: rgba(35,47,62,0.10); stroke-width: 0.8; }
    svg .zone-mask, svg .node-mask, svg .label-mask { fill: #ffffff; }
    svg .zone-label, svg .arrow-label, svg .legend-label { font-family: 'Amazon Ember Mono', ui-monospace, monospace; }
    svg .zone-label { fill: rgba(35,47,62,0.40); font-size: 8px; letter-spacing: 0.14em; }
    svg .node { fill: #fff; stroke: #232f3e; stroke-width: 1; }
    svg .node.external { stroke: #545b64; stroke-dasharray: 4 3; }
    svg .node.focal { fill: rgba(236,114,17,0.07); stroke: #ec7211; stroke-width: 1.4; }
    svg .node.survivor { fill: rgba(124,143,111,0.06); stroke: rgba(124,143,111,0.45); }
    svg .node-name { fill: #232f3e; font: 600 12px 'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    svg .node-name.survivor { fill: #7c8f6f; }
    svg .sub { fill: #545b64; font: 400 10px 'Amazon Ember Mono', ui-monospace, monospace; }
    svg .sub.focal { fill: #232f3e; }
    svg .arrow-label { font-size: 8px; font-weight: 600; letter-spacing: 0.08em; }
    svg .legend-label { fill: #545b64; font-size: 8px; }
  </style>
</head>

    <p class="eyebrow">IT current-state · Northwind Retail · before AWS</p>
    <h1>On-premises retail reporting, before the AWS migration</h1>
